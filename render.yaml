# Deploy ไป Render จาก GitHub repo นี้
#
# วิธีใช้: ไปที่ render.com → New → Blueprint → เลือก repo นี้
# Render จะอ่านไฟล์นี้แล้วตั้งค่าให้เอง
#
# ⚠️ THAI_CHART_URL_TOKEN คือความลับที่อยู่ใน URL: https://<host>/<token>/mcp
#    ใช้แบบนี้เพราะหน้า Add custom connector ของ Claude มีแค่ช่อง Name กับ URL
#    ไม่มีที่ให้ใส่ header จึงส่ง bearer token ไปไม่ได้
#
#    ต้องตั้งค่าเองที่แท็บ Environment ด้วยค่าที่ปลอดภัยกับ URL (ไม่มี / + =)
#    สร้างด้วย:  python3 -c "import secrets; print(secrets.token_urlsafe(32))"

services:
  - type: web
    name: thai-chart-mcp
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: THAI_CHART_URL_TOKEN
        sync: false          # ตั้งเองในแท็บ Environment — ห้าม generateValue
      - key: PORT            # generateValue สร้าง base64 ที่มี / + = ซึ่งพัง URL
        value: 8000
